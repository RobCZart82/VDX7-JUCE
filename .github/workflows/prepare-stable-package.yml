name: Prepare stable 1.0.1 installers (VST3 only; no publication)

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character commit SHA already present on main
        required: true
        type: string
      accepted_for_publication:
        description: Mark assets accepted only with an exact reviewed committed approval record (does not publish)
        required: true
        default: false
        type: boolean

# Creates downloadable artifacts only. Accepted metadata requires a committed
# approval for the exact product/tooling pair; this workflow cannot publish.
permissions:
  contents: read

jobs:
  authorize-package:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.authorization.outputs.source_commit }}
      packager_commit: ${{ steps.authorization.outputs.packager_commit }}
      approval_commit: ${{ steps.authorization.outputs.approval_commit }}
      package_label: ${{ steps.authorization.outputs.package_label }}
      workflow_ref: ${{ steps.authorization.outputs.workflow_ref }}
      workflow_git_ref: ${{ steps.authorization.outputs.workflow_git_ref }}
      release_accepted: ${{ steps.authorization.outputs.release_accepted }}
    steps:
      - name: Checkout trusted approval policy and guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: approval-tools
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact package before platform work
        id: authorization
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          ACCEPTED_FOR_PUBLICATION: ${{ inputs.accepted_for_publication }}
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git --no-replace-objects -C approval-tools rev-parse HEAD)" = "$WORKFLOW_COMMIT"
          test "$(git --no-replace-objects -C approval-tools rev-parse "${SOURCE_COMMIT}^{commit}")" = "$SOURCE_COMMIT"
          git --no-replace-objects -C approval-tools merge-base --is-ancestor "$SOURCE_COMMIT" origin/main
          package_args=()
          case "$ACCEPTED_FOR_PUBLICATION" in
            true) package_args+=(--release-accepted) ;;
            false) ;;
            *) exit 1 ;;
          esac
          python3 approval-tools/scripts/package_source.py authorize \
            --repo approval-tools --approval-commit "$WORKFLOW_COMMIT" \
            --commit "$SOURCE_COMMIT" --package-label 1.0.1 \
            --workflow-ref "$WORKFLOW_REF" --workflow-git-ref "$WORKFLOW_GIT_REF" \
            "${package_args[@]}" --github-output "$GITHUB_OUTPUT"

  package:
    needs: authorize-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-universal
          - os: windows-2022
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_COMMIT: ${{ needs.authorize-package.outputs.source_commit }}
      PACKAGER_COMMIT: ${{ needs.authorize-package.outputs.packager_commit }}
      APPROVAL_COMMIT: ${{ needs.authorize-package.outputs.approval_commit }}
      PACKAGE_LABEL: ${{ needs.authorize-package.outputs.package_label }}
      WORKFLOW_REF: ${{ needs.authorize-package.outputs.workflow_ref }}
      WORKFLOW_GIT_REF: ${{ needs.authorize-package.outputs.workflow_git_ref }}
      ACCEPTED_FOR_PUBLICATION: ${{ needs.authorize-package.outputs.release_accepted }}
      INNO_SETUP_VERSION: "6.7.1"
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize-package.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact product source identity and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_COMMIT"
          git --no-replace-objects merge-base --is-ancestor "$SOURCE_COMMIT" origin/main

      - name: Checkout release packager and regression tests
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize-package.outputs.packager_commit }}
          path: release-tools
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact committed approval policy
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize-package.outputs.approval_commit }}
          path: approval-tools
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tooling identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git --no-replace-objects -C release-tools rev-parse HEAD)" = "$PACKAGER_COMMIT"
          test "$(git --no-replace-objects -C approval-tools rev-parse HEAD)" = "$APPROVAL_COMMIT"

      - name: Configure stable macOS Universal build
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DVDX7_RELEASE_BUILD=ON -DVDX7_RELEASE_CANDIDATE=

      - name: Configure stable Windows x64 build
        if: runner.os == 'Windows'
        shell: cmd
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DVDX7_RELEASE_BUILD=ON -DVDX7_RELEASE_CANDIDATE=

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test release packagers
        run: python -m unittest discover -s release-tools/Tests -p "test_*.py" -v

      - name: Prepare matching stable source archive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_args=()
          if [[ "$ACCEPTED_FOR_PUBLICATION" == "true" ]]; then
            package_args+=(--release-accepted)
          fi
          python release-tools/scripts/package_source.py create --repo . \
            --juce build/_deps/juce-src --core build/_deps/retromulator-src \
            --commit "$SOURCE_COMMIT" --package-label "$PACKAGE_LABEL" \
            --packager-commit "$PACKAGER_COMMIT" \
            --approval-repo approval-tools --approval-commit "$APPROVAL_COMMIT" \
            --workflow-ref "$WORKFLOW_REF" --workflow-git-ref "$WORKFLOW_GIT_REF" \
            "${package_args[@]}" \
            --output stable-source

      - name: Build stable VST3 and ROM-free tests
        run: cmake --build build --config Release --parallel 4 --target VDX7_VST3 vdx7_ci_checks

      - name: Run ROM-free tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Verify and package macOS VST3 installer and manual ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VST3="build/VDX7_artefacts/Release/VST3/VDX7.vst3"
          test -d "$VST3"
          lipo "$VST3/Contents/MacOS/VDX7" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$VST3"
          codesign --verify --deep --strict "$VST3"

          mkdir -p release-assets "$RUNNER_TEMP/vdx7-pkg-root/Library/Audio/Plug-Ins/VST3"
          ditto "$VST3" "$RUNNER_TEMP/vdx7-pkg-root/Library/Audio/Plug-Ins/VST3/VDX7.vst3"
          ditto -c -k --sequesterRsrc --keepParent "$VST3" \
            release-assets/VDX7-1.0.1-macOS-universal-Manual.zip

          pkgbuild \
            --root "$RUNNER_TEMP/vdx7-pkg-root" \
            --identifier com.robczart82.vdx7.vst3 \
            --version 1.0.1 \
            --install-location / \
            --ownership recommended \
            release-assets/VDX7-1.0.1-macOS-universal.pkg

          pkgutil --payload-files release-assets/VDX7-1.0.1-macOS-universal.pkg > "$RUNNER_TEMP/vdx7-pkg-payload.txt"
          grep -Fq "Library/Audio/Plug-Ins/VST3/VDX7.vst3/Contents/Info.plist" "$RUNNER_TEMP/vdx7-pkg-payload.txt"
          grep -Fq "Library/Audio/Plug-Ins/VST3/VDX7.vst3/Contents/MacOS/VDX7" "$RUNNER_TEMP/vdx7-pkg-payload.txt"

          cat > release-assets/BUILD-INFO-macOS-universal.txt <<EOF
          Product: VDX7 Mk1.
          Stable version: $PACKAGE_LABEL
          Status: $([[ "$ACCEPTED_FOR_PUBLICATION" == "true" ]] && echo "ACCEPTED FOR PUBLICATION; not yet published." || echo "PREPARATION ARTIFACT; not accepted or approved for publication.")
          Source commit: $SOURCE_COMMIT
          Release packager commit: $PACKAGER_COMMIT
          Approval/workflow commit: $APPROVAL_COMMIT
          Workflow ref: $WORKFLOW_REF
          Workflow Git ref: $WORKFLOW_GIT_REF
          Platform: macOS Universal (arm64 + x86_64), deployment target macOS 11.0
          Included format: VST3 only. No AU component is built or packaged.
          Installer: unsigned .pkg; plugin bundle has an ad-hoc signature only.
          Not Developer ID signed or notarized. macOS may show a security warning.
          EOF
          python release-tools/scripts/write_build_provenance.py \
            --build build --source . \
            --juce build/_deps/juce-src --core build/_deps/retromulator-src \
            --platform macOS-universal --output "$RUNNER_TEMP/vdx7-toolchain.txt"
          cat "$RUNNER_TEMP/vdx7-toolchain.txt" >> release-assets/BUILD-INFO-macOS-universal.txt

      - name: Verify and package Windows x64 VST3 installer and manual ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "VDX7.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VDX7.vst3 was not found" }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Compress-Archive -Path $vst3.FullName -DestinationPath "release-assets/VDX7-1.0.1-Windows-x64-Manual.zip"

          choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $innoInfo = (Get-Item -LiteralPath $iscc).VersionInfo
          $innoVersion = "$($innoInfo.ProductMajorPart).$($innoInfo.ProductMinorPart).$($innoInfo.ProductBuildPart)"
          if ($innoVersion -ne $env:INNO_SETUP_VERSION) { throw "Inno Setup version mismatch: $innoVersion" }
          & $iscc "/DPluginBundle=$($vst3.FullName)" "/O$((Get-Location).Path)\release-assets" "installer\windows\VDX7.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $setup = Join-Path (Get-Location) "release-assets\VDX7-1.0.1-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe was not produced" }
          $installDir = Join-Path $env:ProgramFiles "Common Files\VST3\VDX7.vst3"
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke test failed: $($install.ExitCode)" }
          if (-not (Test-Path (Join-Path $installDir "Contents\Resources\moduleinfo.json"))) {
            # JUCE bundle payloads vary; require the core bundle marker instead.
            if (-not (Test-Path (Join-Path $installDir "Contents\Info.plist"))) {
              throw "Installed VST3 bundle marker not found at $installDir"
            }
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            $uninstallKey = Get-ChildItem "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Get-ItemProperty | Where-Object { $_.DisplayName -eq "VDX7 Mk1." } | Select-Object -First 1
            if (-not $uninstallKey) { throw "Installer uninstall registration missing" }
            $uninstallExe = $uninstallKey.UninstallString.Trim('"')
          } else {
            $uninstallExe = $uninstaller
          }
          $uninstall = Start-Process -FilePath $uninstallExe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller smoke test failed: $($uninstall.ExitCode)" }
          if (Test-Path $installDir) { throw "Uninstaller left the VST3 bundle behind" }

          $status = if ($env:ACCEPTED_FOR_PUBLICATION -eq "true") {
            "ACCEPTED FOR PUBLICATION; not yet published."
          } else {
            "PREPARATION ARTIFACT; not accepted or approved for publication."
          }
          @"
          Product: VDX7 Mk1.
          Stable version: $env:PACKAGE_LABEL
          Status: $status
          Source commit: $env:SOURCE_COMMIT
          Release packager commit: $env:PACKAGER_COMMIT
          Approval/workflow commit: $env:APPROVAL_COMMIT
          Workflow ref: $env:WORKFLOW_REF
          Workflow Git ref: $env:WORKFLOW_GIT_REF
          Platform: Windows x64
          Included format: VST3 only. No AU component is built or packaged.
          Installer: unsigned Setup.exe; Windows may show an unknown-publisher warning.
          "@ | Set-Content -Encoding utf8 release-assets/BUILD-INFO-Windows-x64.txt
          $provenance = Join-Path $env:RUNNER_TEMP "vdx7-toolchain.txt"
          python release-tools/scripts/write_build_provenance.py `
            --build build --source . `
            --juce build/_deps/juce-src --core build/_deps/retromulator-src `
            --platform Windows-x64 --inno "$iscc" --inno-version "$innoVersion" --output "$provenance"
          if ($LASTEXITCODE -ne 0) { throw "Build provenance capture failed: $LASTEXITCODE" }
          Get-Content -LiteralPath $provenance | Add-Content -Encoding utf8 release-assets/BUILD-INFO-Windows-x64.txt
          Copy-Item stable-source/*.zip release-assets/

      - name: Upload platform validation artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-${{ needs.authorize-package.outputs.package_label }}-${{ matrix.platform }}-${{ needs.authorize-package.outputs.source_commit }}-${{ needs.authorize-package.outputs.release_accepted == 'true' && 'accepted' || 'prep' }}
          path: |
            release-assets/VDX7-1.0.1-*
            release-assets/BUILD-INFO-*.txt
          if-no-files-found: error

  assemble-release-assets:
    needs: [authorize-package, package]
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ needs.authorize-package.outputs.source_commit }}
      PACKAGE_LABEL: ${{ needs.authorize-package.outputs.package_label }}
      APPROVAL_COMMIT: ${{ needs.authorize-package.outputs.approval_commit }}
    steps:
      - name: Checkout guarded checksum tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize-package.outputs.approval_commit }}
          path: approval-tools
          persist-credentials: false

      - name: Verify checksum tooling identity
        shell: bash
        run: test "$(git --no-replace-objects -C approval-tools rev-parse HEAD)" = "$APPROVAL_COMMIT"

      - name: Download both platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: VDX7-${{ needs.authorize-package.outputs.package_label }}-*-${{ needs.authorize-package.outputs.source_commit }}-${{ needs.authorize-package.outputs.release_accepted == 'true' && 'accepted' || 'prep' }}
          path: release-assets
          merge-multiple: true

      - name: Verify complete asset inventory and SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/VDX7-1.0.1-macOS-universal.pkg"
          test -f "release-assets/VDX7-1.0.1-macOS-universal-Manual.zip"
          test -f "release-assets/VDX7-1.0.1-Windows-x64-Setup.exe"
          test -f "release-assets/VDX7-1.0.1-Windows-x64-Manual.zip"
          test -f "release-assets/VDX7-${PACKAGE_LABEL}-${SOURCE_COMMIT}-corresponding-source.zip"
          test -f "release-assets/BUILD-INFO-macOS-universal.txt"
          test -f "release-assets/BUILD-INFO-Windows-x64.txt"

          python3 approval-tools/scripts/write_sha256_manifest.py \
            --output release-assets/SHA256SUMS.txt \
            release-assets/VDX7-1.0.1-macOS-universal.pkg \
            release-assets/VDX7-1.0.1-macOS-universal-Manual.zip \
            release-assets/VDX7-1.0.1-Windows-x64-Setup.exe \
            release-assets/VDX7-1.0.1-Windows-x64-Manual.zip \
            "release-assets/VDX7-${PACKAGE_LABEL}-${SOURCE_COMMIT}-corresponding-source.zip" \
            release-assets/BUILD-INFO-macOS-universal.txt \
            release-assets/BUILD-INFO-Windows-x64.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Stage exactly four user downloads (not publication)
        shell: bash
        run: |
          set -euo pipefail
          python3 approval-tools/scripts/stage_release_downloads.py \
            --assets release-assets --output publishable-downloads \
            --package-label "$PACKAGE_LABEL"

      - name: Upload complete validation artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-${{ needs.authorize-package.outputs.package_label }}-Release-Assets-${{ needs.authorize-package.outputs.source_commit }}-${{ needs.authorize-package.outputs.release_accepted == 'true' && 'accepted' || 'prep' }}
          path: release-assets/*
          if-no-files-found: error

      - name: Upload four user downloads (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-${{ needs.authorize-package.outputs.package_label }}-Four-Downloads-${{ needs.authorize-package.outputs.source_commit }}-${{ needs.authorize-package.outputs.release_accepted == 'true' && 'accepted' || 'prep' }}
          path: |
            publishable-downloads/VDX7-${{ needs.authorize-package.outputs.package_label }}-Windows-x64-Setup.exe
            publishable-downloads/VDX7-${{ needs.authorize-package.outputs.package_label }}-Windows-x64-Manual.zip
            publishable-downloads/VDX7-${{ needs.authorize-package.outputs.package_label }}-macOS-universal.pkg
            publishable-downloads/VDX7-${{ needs.authorize-package.outputs.package_label }}-macOS-universal-Manual.zip
          if-no-files-found: error
