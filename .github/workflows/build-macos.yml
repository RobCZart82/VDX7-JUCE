name: Build macOS VST3

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Universal macOS build
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build VST3
        run: |
          cmake --build build \
            --config Release \
            --target VDX7_VST3 vdx7_ci_checks

      - name: ROM-free regression tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Local-ROM test registration smoke (does not execute tests)
        run: |
          cmake -E make_directory build-rom-registration
          cmake -E touch build-rom-registration/fixture.placeholder
          cmake -S . -B build-rom-registration -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DVDX7_ENABLE_ROM_TESTS=ON \
            -DVDX7_TEST_ROM_FILE="$(pwd)/build-rom-registration/fixture.placeholder"
          ctest --test-dir build-rom-registration -C Release -N --show-only=json-v1 > rom-test-registration.json
          python3 -c 'import json; d=json.load(open("rom-test-registration.json")); t=next(x for x in d["tests"] if x["name"]=="vdx7_pending_rom_content_identity"); p={x["name"]:x["value"] for x in t["properties"]}; assert "vdx7_v18_rom" in p["FIXTURES_REQUIRED"], "pending ROM identity test is missing its v1.8 fixture requirement"'

      - name: Locate VST3
        run: |
          find build -name "VDX7.vst3" -print

      - name: Ad-hoc sign VST3
        run: |
          VST3_PATH="$(find build -name "VDX7.vst3" -type d | head -n 1)"
          echo "VST3_PATH=$VST3_PATH"
          codesign --force --deep --sign - "$VST3_PATH"

      - name: Package VST3
        run: |
          VST3_PATH="$(find build -name "VDX7.vst3" -type d | head -n 1)"
          ditto -c -k --sequesterRsrc --keepParent \
            "$VST3_PATH" \
            VDX7-macOS-universal-VST3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-macOS-universal-VST3
          path: VDX7-macOS-universal-VST3.zip
