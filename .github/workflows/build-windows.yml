name: Build Windows VST3 and Standalone

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate installer upgrade smoke syntax
        # Installer integration runs only in prepare-stable-package.yml.
        # Parse its helper here so syntax errors are caught by the PR gate.
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/smoke_windows_upgrade.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }

      - name: Configure Windows x64 build
        shell: cmd
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 and Standalone
        shell: cmd
        run: >
          cmake --build build
          --config Release
          --target VDX7_VST3 VDX7_Standalone vdx7_ci_checks

      - name: ROM-free regression tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Source packaging regression tests (no ROM)
        run: python -m unittest discover -s Tests -p "test_*.py" -v

      - name: Local-ROM test registration smoke (does not execute tests)
        shell: pwsh
        run: |
          cmake -E make_directory build-rom-registration
          cmake -E touch build-rom-registration/fixture.placeholder
          cmake -S . -B build-rom-registration `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DVDX7_ENABLE_ROM_TESTS=ON `
            -DVDX7_TEST_ROM_FILE="$PWD/build-rom-registration/fixture.placeholder" `
            -DVDX7_TEST_FACTORY_BANK_FOLDER="$PWD/build-rom-registration"
          if ($LASTEXITCODE -ne 0) { throw "ROM-enabled configuration failed" }
          ctest --test-dir build-rom-registration -C Release -N --show-only=json-v1 | Set-Content -Encoding utf8 rom-test-registration.json
          if ($LASTEXITCODE -ne 0) { throw "CTest inventory failed" }
          python scripts/check_test_registration.py rom-test-registration.json --self-test --factory-bank-library
          if ($LASTEXITCODE -ne 0) { throw "ROM-enabled registration contract failed" }
          ctest --test-dir build -C Release -N --show-only=json-v1 | Set-Content -Encoding utf8 rom-free-registration.json
          if ($LASTEXITCODE -ne 0) { throw "ROM-free CTest inventory failed" }
          python scripts/check_test_registration.py rom-free-registration.json --rom-free-only
          if ($LASTEXITCODE -ne 0) { throw "ROM-free registration contract failed" }

      - name: Locate VST3
        shell: powershell
        run: |
          Get-ChildItem -Path build -Recurse -Filter "VDX7.vst3"

      - name: Package VST3
        shell: powershell
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "VDX7.vst3" | Select-Object -First 1
          if (-not $vst3) {
            throw "VDX7.vst3 was not found"
          }

          Compress-Archive `
            -Path $vst3.FullName `
            -DestinationPath VDX7-Windows-x64-VST3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-Windows-x64-VST3
          path: VDX7-Windows-x64-VST3.zip
