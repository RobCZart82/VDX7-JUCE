name: Build Windows VST3

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Windows x64 build
        shell: cmd
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: cmd
        run: >
          cmake --build build
          --config Release
          --target VDX7_VST3 vdx7_ci_checks

      - name: ROM-free regression tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Local-ROM test registration smoke (does not execute tests)
        shell: pwsh
        run: |
          cmake -E make_directory build-rom-registration
          cmake -E touch build-rom-registration/fixture.placeholder
          cmake -S . -B build-rom-registration `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DVDX7_ENABLE_ROM_TESTS=ON `
            -DVDX7_TEST_ROM_FILE="$PWD/build-rom-registration/fixture.placeholder"
          $listing = ctest --test-dir build-rom-registration -C Release -N --show-only=json-v1 | Out-String | ConvertFrom-Json
          $test = $listing.tests | Where-Object { $_.name -eq "vdx7_pending_rom_content_identity" }
          if (-not $test) {
            throw "Pending ROM identity regression was not registered"
          }
          $fixture = $test.properties | Where-Object { $_.name -eq "FIXTURES_REQUIRED" }
          if (-not $fixture -or $fixture.value -notcontains "vdx7_v18_rom") {
            throw "Pending ROM identity regression is missing the v1.8 fixture requirement"
          }

      - name: Locate VST3
        shell: powershell
        run: |
          Get-ChildItem -Path build -Recurse -Filter "VDX7.vst3"

      - name: Package VST3
        shell: powershell
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "VDX7.vst3" | Select-Object -First 1
          if (-not $vst3) {
            throw "VDX7.vst3 was not found"
          }

          Compress-Archive `
            -Path $vst3.FullName `
            -DestinationPath VDX7-Windows-x64-VST3.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-Windows-x64-VST3
          path: VDX7-Windows-x64-VST3.zip
