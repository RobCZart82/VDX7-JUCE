name: Prepare v1.2.0 release-candidate packages (no publication)

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character current main commit SHA (must equal this workflow run's SHA)
        required: true
        type: string
      candidate_label:
        description: Release-candidate label (rc1, rc2, ...); this only creates validation artifacts
        required: true
        type: string
      package_kind:
        description: Candidate (default) or final-version validation packages; neither publishes
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - final

# Candidate packaging only. No tags, GitHub Releases, or asset replacement.
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-universal
          - os: windows-2022
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CANDIDATE_LABEL: ${{ inputs.candidate_label }}
      PACKAGE_LABEL: 1.2.0-${{ inputs.candidate_label }}
      INNO_SETUP_VERSION: "6.7.1"
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main ref, exact source and candidate label
        shell: bash
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          PACKAGE_KIND: ${{ inputs.package_kind || 'candidate' }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_COMMIT" == "$WORKFLOW_COMMIT" ]]
          [[ "$CANDIDATE_LABEL" =~ ^rc[1-9][0-9]*$ ]]
          case "$PACKAGE_KIND" in
            candidate)
              echo "CONFIGURE_CANDIDATE=$CANDIDATE_LABEL" >> "$GITHUB_ENV"
              echo 'CONFIGURE_RELEASE=OFF' >> "$GITHUB_ENV"
              ;;
            final)
              echo 'PACKAGE_LABEL=1.2.0' >> "$GITHUB_ENV"
              echo 'CONFIGURE_CANDIDATE=' >> "$GITHUB_ENV"
              echo 'CONFIGURE_RELEASE=ON' >> "$GITHUB_ENV"
              ;;
            *) echo 'Unsupported package kind' >&2; exit 1 ;;
          esac
          test "$(git --no-replace-objects rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git --no-replace-objects status --porcelain --untracked-files=no)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test packaging and release guards
        run: python -m unittest discover -s Tests -p "test_*.py" -v

      - name: Configure macOS Universal candidate
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PROJECT_VDX7_JUCE_INCLUDE=${GITHUB_WORKSPACE}/cmake/VDX7DependencySources.cmake"
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          "-DVDX7_RELEASE_BUILD=${CONFIGURE_RELEASE}"
          "-DVDX7_RELEASE_CANDIDATE=${CONFIGURE_CANDIDATE}"

      - name: Configure Windows x64 candidate
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            "-DCMAKE_PROJECT_VDX7_JUCE_INCLUDE=${GITHUB_WORKSPACE}/cmake/VDX7DependencySources.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            "-DVDX7_RELEASE_BUILD=${CONFIGURE_RELEASE}" \
            "-DVDX7_RELEASE_CANDIDATE=${CONFIGURE_CANDIDATE}"

      - name: Build VST3 and ROM-free test targets
        run: cmake --build build --config Release --parallel 4 --target VDX7_VST3 vdx7_ci_checks

      - name: Run ROM-free tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Prepare matching source archive for Manual ZIP
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_source.py create \
            --repo . --juce build/_deps/juce-src --core build/_deps/retromulator-src \
            --commit "$SOURCE_COMMIT" --package-label "$PACKAGE_LABEL" \
            --output candidate-source

      - name: Verify macOS Universal binary and prepare PKG plus Manual ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          vst3="build/VDX7_artefacts/Release/VST3/VDX7.vst3"
          test -d "$vst3"
          lipo "$vst3/Contents/MacOS/VDX7" -verify_arch arm64 x86_64
          codesign --force --deep --sign - "$vst3"
          codesign --verify --deep --strict "$vst3"

          mkdir -p release-assets "$RUNNER_TEMP/vdx7-pkg-root/Library/Audio/Plug-Ins/VST3" \
            "$RUNNER_TEMP/vdx7-manual/Source"
          ditto "$vst3" "$RUNNER_TEMP/vdx7-pkg-root/Library/Audio/Plug-Ins/VST3/VDX7.vst3"
          ditto "$vst3" "$RUNNER_TEMP/vdx7-manual/VDX7.vst3"
          source_archive="$(find candidate-source -maxdepth 1 -type f -name '*-corresponding-source.zip' -print -quit)"
          test -n "$source_archive"
          source_archive_name="$(basename "$source_archive")"
          cp "$source_archive" "$RUNNER_TEMP/vdx7-manual/Source/"
          cp candidate-source/SHA256SUMS.txt "$RUNNER_TEMP/vdx7-manual/Source/SHA256SUMS.txt"
          ditto -c -k --sequesterRsrc "$RUNNER_TEMP/vdx7-manual" \
            "release-assets/VDX7-${PACKAGE_LABEL}-macOS-universal-Manual.zip"
          python scripts/verify_manual_source_bundles.py \
            --source-name "$source_archive_name" \
            --manual-zip "release-assets/VDX7-${PACKAGE_LABEL}-macOS-universal-Manual.zip"
          pkgbuild \
            --root "$RUNNER_TEMP/vdx7-pkg-root" \
            --identifier com.robczart82.vdx7.vst3 \
            --version 1.2.0 \
            --install-location / \
            --ownership recommended \
            "release-assets/VDX7-${PACKAGE_LABEL}-macOS-universal.pkg"

          pkgutil --payload-files "release-assets/VDX7-${PACKAGE_LABEL}-macOS-universal.pkg" > "$RUNNER_TEMP/vdx7-pkg-payload.txt"
          grep -Fq "Library/Audio/Plug-Ins/VST3/VDX7.vst3/Contents/Info.plist" "$RUNNER_TEMP/vdx7-pkg-payload.txt"
          grep -Fq "Library/Audio/Plug-Ins/VST3/VDX7.vst3/Contents/MacOS/VDX7" "$RUNNER_TEMP/vdx7-pkg-payload.txt"

          cat > "release-assets/BUILD-INFO-${{ matrix.platform }}.txt" <<EOF
          Product: VDX7 Mk1.
          Candidate: ${PACKAGE_LABEL}
          Status: PREPARATION ONLY; not accepted or approved for publication.
          Source commit: ${SOURCE_COMMIT}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Platform: macOS Universal (arm64 + x86_64), deployment target macOS 11.0
          Included format: VST3 only.
          Installer: unsigned PKG; plugin bundle has an ad-hoc signature only.
          Not Developer ID signed or notarized; macOS may show a security warning.
          Firmware: no Yamaha ROM or firmware included.
          Matching source archive: included in the Manual ZIP under Source/; its SHA-256 is verified.
          EOF
          python scripts/write_build_provenance.py \
            --build build --source . \
            --juce build/_deps/juce-src --core build/_deps/retromulator-src \
            --platform macOS-universal --output "$RUNNER_TEMP/vdx7-toolchain.txt"
          cat "$RUNNER_TEMP/vdx7-toolchain.txt" >> "release-assets/BUILD-INFO-${{ matrix.platform }}.txt"

      - name: Install Inno Setup and verify its version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          $version = python scripts/verify_inno_version.py --inno "$iscc" --expected "$env:INNO_SETUP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup version verification failed: $LASTEXITCODE" }
          "ISCC=$iscc" >> $env:GITHUB_ENV
          "ISCC_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify Windows VST3 and prepare Setup EXE plus Manual ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "VDX7.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "VDX7.vst3 was not found" }
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $manualRoot = Join-Path $env:RUNNER_TEMP "vdx7-manual"
          $manualSource = Join-Path $manualRoot "Source"
          New-Item -ItemType Directory -Path $manualSource -Force | Out-Null
          Copy-Item -LiteralPath $vst3.FullName -Destination (Join-Path $manualRoot "VDX7.vst3") -Recurse
          $sourceArchive = Get-ChildItem -Path candidate-source -Filter "*-corresponding-source.zip" | Select-Object -First 1
          if (-not $sourceArchive) { throw "Corresponding source archive was not prepared" }
          Copy-Item -LiteralPath $sourceArchive.FullName -Destination $manualSource
          Copy-Item -LiteralPath "candidate-source\SHA256SUMS.txt" -Destination (Join-Path $manualSource "SHA256SUMS.txt")
          $manualZip = "release-assets\VDX7-$env:PACKAGE_LABEL-Windows-x64-Manual.zip"
          Compress-Archive -Path (Join-Path $manualRoot "*") -DestinationPath $manualZip
          python scripts/verify_manual_source_bundles.py --source-name $sourceArchive.Name --manual-zip $manualZip
          if ($LASTEXITCODE -ne 0) { throw "Windows manual ZIP source verification failed: $LASTEXITCODE" }
          $setupBaseName = "VDX7-$env:PACKAGE_LABEL-Windows-x64-Setup"
          & $env:ISCC "/DPluginBundle=$($vst3.FullName)" "/O$((Get-Location).Path)\release-assets" "/F$setupBaseName" "installer\windows\VDX7.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $setup = Join-Path (Get-Location) "release-assets\VDX7-$env:PACKAGE_LABEL-Windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup.exe was not produced" }
          $installDir = Join-Path $env:ProgramFiles "Common Files\VST3\VDX7.vst3"
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke test failed: $($install.ExitCode)" }
          $installedModuleInfo = Join-Path $installDir "Contents\Resources\moduleinfo.json"
          $installedVst3Binary = Join-Path $installDir "Contents\x86_64-win\VDX7.vst3"
          if (-not (Test-Path $installedModuleInfo -PathType Leaf) -or
              -not (Test-Path $installedVst3Binary -PathType Leaf)) {
            throw "Installed Windows VST3 metadata or platform binary missing at $installDir"
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Installer uninstall executable not found" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller smoke test failed: $($uninstall.ExitCode)" }
          if (Test-Path $installDir) { throw "Uninstaller left the VST3 bundle behind" }

          @"
          Product: VDX7 Mk1.
          Candidate: $env:PACKAGE_LABEL
          Status: PREPARATION ONLY; not accepted or approved for publication.
          Source commit: $env:SOURCE_COMMIT
          Workflow run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Platform: Windows x64
          Included format: VST3 only.
          Installer: unsigned Setup.exe; Windows may show an unknown-publisher warning.
          Firmware: no Yamaha ROM or firmware included.
          Matching source archive: included in the Manual ZIP under Source/; its SHA-256 is verified.
          Inno Setup: $env:ISCC_VERSION
          "@ | Set-Content -Encoding utf8 "release-assets\BUILD-INFO-Windows-x64.txt"
          $provenance = Join-Path $env:RUNNER_TEMP "vdx7-toolchain.txt"
          python scripts/write_build_provenance.py `
            --build build --source . `
            --juce build/_deps/juce-src --core build/_deps/retromulator-src `
            --platform Windows-x64 --inno $env:ISCC --inno-version $env:ISCC_VERSION --output $provenance
          if ($LASTEXITCODE -ne 0) { throw "Build provenance capture failed: $LASTEXITCODE" }
          Get-Content -LiteralPath $provenance | Add-Content -Encoding utf8 "release-assets\BUILD-INFO-Windows-x64.txt"

      - name: Upload platform validation artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-${{ env.PACKAGE_LABEL }}-${{ matrix.platform }}-${{ env.SOURCE_COMMIT }}-PREPARATION
          path: release-assets/*
          if-no-files-found: error

  assemble-candidate-downloads:
    needs: package
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      PACKAGE_LABEL: 1.2.0-${{ inputs.candidate_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve final-version assembly label
        if: inputs.package_kind == 'final'
        run: echo 'PACKAGE_LABEL=1.2.0' >> "$GITHUB_ENV"

      - name: Download both platform preparation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: VDX7-${{ env.PACKAGE_LABEL }}-*-${{ env.SOURCE_COMMIT }}-PREPARATION
          path: release-assets
          merge-multiple: true

      - name: Verify exact four candidate downloads and source evidence
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            "VDX7-${PACKAGE_LABEL}-Windows-x64-Setup.exe" \
            "VDX7-${PACKAGE_LABEL}-Windows-x64-Manual.zip" \
            "VDX7-${PACKAGE_LABEL}-macOS-universal.pkg" \
            "VDX7-${PACKAGE_LABEL}-macOS-universal-Manual.zip" \
            "BUILD-INFO-Windows-x64.txt" \
            "BUILD-INFO-macOS-universal.txt"; do
            test -f "release-assets/$name"
          done
          python scripts/verify_manual_source_bundles.py \
            --source-name "VDX7-${PACKAGE_LABEL}-${SOURCE_COMMIT}-corresponding-source.zip" \
            --manual-zip "release-assets/VDX7-${PACKAGE_LABEL}-Windows-x64-Manual.zip" \
            --manual-zip "release-assets/VDX7-${PACKAGE_LABEL}-macOS-universal-Manual.zip"
          python scripts/write_sha256_manifest.py \
            --output release-assets/SHA256SUMS.txt \
            "release-assets/VDX7-${PACKAGE_LABEL}-Windows-x64-Setup.exe" \
            "release-assets/VDX7-${PACKAGE_LABEL}-Windows-x64-Manual.zip" \
            "release-assets/VDX7-${PACKAGE_LABEL}-macOS-universal.pkg" \
            "release-assets/VDX7-${PACKAGE_LABEL}-macOS-universal-Manual.zip" \
            release-assets/BUILD-INFO-Windows-x64.txt \
            release-assets/BUILD-INFO-macOS-universal.txt
          (cd release-assets && sha256sum -c SHA256SUMS.txt)

      - name: Upload combined candidate artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: VDX7-${{ env.PACKAGE_LABEL }}-Four-Downloads-${{ env.SOURCE_COMMIT }}-PREPARATION
          path: release-assets/*
          if-no-files-found: error
