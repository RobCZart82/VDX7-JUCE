name: Prepare exact-commit release candidate

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character source commit SHA (no branch or tag names)
        required: true
        type: string
      candidate_label:
        description: Release-candidate label (rc1, rc2, ...); this does not publish a release
        required: true
        type: string

# Deliberately cannot publish, tag, or overwrite any existing release asset.
# Final publication is a separate step after docs/release/ROADMAP_1.0.md acceptance.
permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS-universal
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - os: windows-2022
            platform: Windows-x64
            configure: -A x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - name: Configure exact release candidate
        shell: bash
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DVDX7_RELEASE_BUILD=OFF
          "-DVDX7_RELEASE_CANDIDATE=$CANDIDATE_LABEL"
          ${{ matrix.configure }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source packager
        run: python -m unittest discover -s Tests -p test_package_source.py -v
      - name: Prepare matching complete source (no publication)
        run: >-
          python scripts/package_source.py create --repo .
          --juce build/_deps/juce-src --core build/_deps/retromulator-src
          --commit ${{ inputs.source_commit }} --output candidate-source
      - name: Build plugin and ROM-free tests
        run: cmake --build build --config Release --parallel 4 --target VDX7_VST3 vdx7_ci_checks
      - name: Run ROM-free tests
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
      - name: Verify macOS candidate signature
        if: runner.os == 'macOS'
        run: |
          lipo build/VDX7_artefacts/Release/VST3/VDX7.vst3/Contents/MacOS/VDX7 -verify_arch arm64 x86_64
          codesign --force --deep --sign - build/VDX7_artefacts/Release/VST3/VDX7.vst3
          codesign --verify --deep --strict build/VDX7_artefacts/Release/VST3/VDX7.vst3
      - uses: actions/upload-artifact@v4
        with:
          name: VDX7-1.0.0-${{ inputs.candidate_label }}-${{ matrix.platform }}-${{ inputs.source_commit }}
          path: |
            build/VDX7_artefacts/Release/VST3/VDX7.vst3
            README.md
            README_HU.md
            docs
            LICENSE.txt
            LICENSES
            NOTICE.md
            THIRD_PARTY.md
            candidate-source/*.zip
            candidate-source/SHA256SUMS.txt
          if-no-files-found: error
